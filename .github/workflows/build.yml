name: build

on:
  push:
    branches: [main]
    paths: ['src/**', 'assets/**', 'tools/**', 'build.sh', 'requirements.txt', '.github/workflows/build.yml']
  pull_request:
    paths: ['src/**', 'assets/**', 'tools/**', 'build.sh', 'requirements.txt']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: собрать книгу и проверить вёрстку
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Собрать и проверить
        run: ./build.sh

      - name: Проверить число страниц
        run: |
          python3 - <<'PY'
          import pdfplumber
          with pdfplumber.open("dist/sail-logbook-A5-final.pdf") as pdf:
              n = len(pdf.pages)
          print(f"страниц: {n}")
          assert n % 2 == 0, f"нечётное число страниц: {n} — двусторонняя печать разъедется"
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: sail-logbook-pdf
          path: dist/*.pdf
          retention-days: 14
          if-no-files-found: error
